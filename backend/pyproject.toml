[project]
name = "myapp-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["B008"]              # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]          # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
