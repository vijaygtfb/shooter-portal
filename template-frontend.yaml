AWSTemplateFormatVersion: "2010-09-09"
Description: MyApp frontend - S3 static website hosting for the React SPA

Parameters:
  AppName:
    Type: String
    Default: myapp
  EnvName:
    Type: String
    AllowedValues: [test, uat, prod]

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AppName}-${EnvName}-web-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html        # SPA fallback for client-side routes
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:    # website endpoint needs a public-read bucket policy
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

Outputs:
  WebsiteBucketName:
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Value: !GetAtt WebsiteBucket.WebsiteURL
